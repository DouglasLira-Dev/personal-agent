# ============================================
# Configuracao de producao (Render)
# ============================================
spring:
  # H2 em arquivo no diretorio /app/data (gravável no Render)
  datasource:
    url: jdbc:h2:file:/app/data/agente;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Console H2 desabilitado em producao
  h2:
    console:
      enabled: false

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# Actuator — health check apenas
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

# Logs em producao
logging:
  level:
    root: INFO
    com.agente.pessoal: INFO