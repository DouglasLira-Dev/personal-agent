# ============================================
# Configuracao da aplicacao
# ============================================
server:
  port: ${PORT:8080}

spring:
  application:
    name: agente-pessoal

  # ============================================
  # Banco de dados H2 em arquivo (persistente)
  # ============================================
  datasource:
    url: jdbc:h2:file:./data/agente;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ============================================
  # JPA / Hibernate
  # ============================================
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ============================================
  # Console H2 (dev)
  # ============================================
  h2:
    console:
      enabled: true
      path: /h2-console

  # ============================================
  # Spring AI + OpenRouter
  # ============================================
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openrouter/auto
          temperature: 0.7

    # ============================================
    # Memoria de conversa em JDBC
    # ============================================
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# ============================================
# Actuator
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================================
# Logs
# ============================================
logging:
  level:
    com.agente.pessoal: DEBUG