# ============================================
# Configuração da aplicação
# ============================================
server:
  port: ${PORT:8080}

spring:
  application:
    name: agente-pessoal

  # ============================================
  # Banco de dados H2 (modo PostgreSQL)
  # ============================================
  datasource:
    url: jdbc:h2:mem:agente-pessoal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ============================================
  # JPA / Hibernate
  # ============================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Configuração do Spring AI + OpenRouter
  ai:
    openai:
      # Chave de API via variável de ambiente (NUNCA hardcoded)
      api-key: ${OPENROUTER_API_KEY}
      # Endpoint compatível com OpenAI (OpenRouter usa este formato)
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Modelo gratuito
          model: openrouter/auto
          # Equilíbrio entre criatividade e precisão
          temperature: 0.7
    # ============================================
    # Memoria de conversa em JDBC
    # ============================================
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# Configuração do Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# LOGS - FORMATO LIMPO EM PRODUCAO
logging:
  level:
    com.agente.pessoal: DEBUG